services:
  - type: web
    name: contrib-compass-api
    env: node
    rootDir: server
    buildCommand: npm ci && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
